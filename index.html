<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google 免費影音生成工具 10 選</title>
<style>
  :root{--bg:#f6f8fc;--card:#fff;--ink:#1f2937;--muted:#6b7280;--blue:#1a73e8;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(135deg,#1a73e8,#34a853);color:#fff;padding:32px 20px;text-align:center}
  header h1{margin:0 0 6px;font-size:1.8rem}
  header p{margin:0;opacity:.9}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .filter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:.95rem;cursor:pointer}
  .filter button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
  .card .no{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:0 8px;font-size:.85rem;margin-right:6px}
  .card .tag{float:right;font-size:.8rem;background:#e8f0fe;color:var(--blue);border-radius:6px;padding:2px 8px}
  .card h3{margin:4px 0 10px;font-size:1.1rem}
  .card .lbl{font-weight:700;font-size:.85rem;color:var(--muted);margin-top:6px}
  .card .limit{color:#b45309}
  .card .acts{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card a{color:var(--blue);font-weight:700;text-decoration:none}
  .card a.zip{background:#e8f0fe;border-radius:999px;padding:4px 12px;font-size:.9rem}
  .note{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:8px;margin:20px 0}


  code{background:#f1f3f4;padding:2px 6px;border-radius:4px;font-size:.88rem;word-break:break-all}
  footer{text-align:center;color:var(--muted);padding:28px 20px;font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1>🎬 Google 免費影音生成工具 10 選</h1>
  <p>只要 Google 帳號就能用（資料截至 2026 年 11 月）</p>
</header>

<div class="wrap">
  <div class="filter" id="filter">
    <button class="on" data-c="全部">全部</button>
    <button data-c="影片">🎥 影片</button>
    <button data-c="音訊">🎵 音訊</button>
    <button data-c="故事">📖 故事</button>
  </div>

  <main id="grid"></main>

  <div class="note">⚠️ 多數功能限 18 歲以上使用；免費額度 Google 會隨時調整，上課前請先實測一次。</div>
</div>

<footer>設計：智慧未來領袖學苑｜LINE ID：snake0203cheng</footer>

<script>
const tools = [
  {n:1, name:"Gemini Storybook（故事書）", cat:"故事", free:"輸入故事描述就生成 10 頁插畫故事書，附朗讀旁白", limit:"免費開放給所有 18 歲以上使用者", url:"https://gemini.google.com/gem/storybook"},
  {n:2, name:"NotebookLM 影片摘要", cat:"影片", free:"把筆記、PDF、圖片轉成視覺化簡報影片，會引用文件裡的圖表、引言和數據", limit:"限 18 歲以上", url:"https://notebooklm.google.com"},
  {n:3, name:"NotebookLM 語音摘要", cat:"音訊", free:"以上傳文件生成 AI 雙主持人的 Podcast 式對談", limit:"NotebookLM 目前免費，有 Google 帳號就能用", url:"https://notebooklm.google.com"},
  {n:4, name:"Google Flow", cat:"影片", free:"每天 50 點免費 Flow 點數，含 Gemini Omni Flash、Nano Banana Pro、Veo 3.1、Agent、文字轉影片、畫格轉影片", limit:"免費版不能做 1080p 升級，尖峰時段影片可能被擋", url:"https://labs.google/fx/tools/flow"},
  {n:5, name:"Gemini Omni（透過 Flow）", cat:"影片", free:"所有使用者都能用 Omni 模型，包括 10 秒短片和影片編輯", limit:"Gemini App 裡用 Omni 生成影片要付費，免費版請改走 Flow 或 YouTube", url:"https://labs.google/fx/tools/flow"},
  {n:6, name:"Google Vids", cat:"影片", free:"所有 Google 帳號都能免費用 Veo 3.1 生成影片片段", limit:"Vids 裡的 Lyria 配樂生成僅限 Pro/Ultra 付費用戶", url:"https://docs.google.com/videos/"},
  {n:7, name:"YouTube Shorts", cat:"影片", free:"Omni Flash 免費生成短影片；Dream Track 可用 Lyria 3 生成配樂", limit:"一次生成，沒有對話式修改", url:"https://www.youtube.com/shorts"},
  {n:8, name:"YouTube Create App", cat:"影片", free:"Google 的免費手機影片剪輯 App，內建 Omni Flash", limit:"僅手機版", url:"https://play.google.com/store/search?q=YouTube%20Create"},
  {n:9, name:"Gemini 音樂（Lyria 3）", cat:"音訊", free:"在 Gemini 的「工具」選單點「音樂」，用文字、圖片、音訊或影片生成 30 秒歌曲", limit:"限 18 歲以上，免費版次數較少", url:"https://gemini.google.com/music"},
  {n:10, name:"Google AI Studio（Lyria）", cat:"音訊", free:"可免費試用 Lyria 音樂生成", limit:"介面偏開發者，較不適合一般學員", url:"https://aistudio.google.com"}
];

const zips = ["01-gemini-storybook", "02-notebooklm-video", "03-notebooklm-audio", "04-google-flow", "05-gemini-omni-flow", "06-google-vids", "07-youtube-shorts", "08-youtube-create", "09-gemini-music", "10-ai-studio-lyria"];
const grid = document.getElementById("grid");
function render(c){
  grid.innerHTML = tools.filter(t => c==="全部" || t.cat===c).map(t => `
    <article class="card">
      <div><span class="no">${t.n}</span><span class="tag">${t.cat}</span></div>
      <h3>${t.name}</h3>
      <div class="lbl">✅ 免費能做什麼</div><div>${t.free}</div>
      <div class="lbl">⚠️ 限制</div><div class="limit">${t.limit}</div>
      <div class="acts"><a href="${t.url}" target="_blank" rel="noopener">前往使用 →</a><a class="zip" href="zips/${zips[t.n-1]}.zip" download>📦 下載專案 zip</a></div>
    </article>`).join("");
}
render("全部");
document.getElementById("filter").addEventListener("click", e => {
  if(e.target.tagName!=="BUTTON") return;
  document.querySelectorAll("#filter button").forEach(b => b.classList.remove("on"));
  e.target.classList.add("on");
  render(e.target.dataset.c);
});
</script>
</body>
</html>
